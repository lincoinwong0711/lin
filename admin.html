<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问卷管理与导出</title><style>body{margin:0;background:#f5f7f4;color:#17251f;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}.card{max-width:560px;margin:12vh auto;background:white;border:1px solid #e5ebe6;border-radius:20px;padding:30px;box-shadow:0 12px 40px #163d2d0b}h1{font-size:25px;margin:0 0 8px}p{color:#66756d}.row{display:flex;gap:9px}input{flex:1;min-width:0;border:1px solid #dce5de;border-radius:10px;padding:12px;font:inherit}button{border:0;border-radius:10px;padding:12px 16px;background:#246b4c;color:white;font-weight:650;font:inherit;cursor:pointer}.msg{margin-top:14px;color:#a53e28}.small{font-size:13px}@media(max-width:520px){.card{margin:8vh 12px;padding:22px}.row{display:block}button{margin-top:9px;width:100%}}</style></head><body><main class="card"><h1>问卷答卷导出</h1><p>输入服务启动时设置的管理口令，即可下载当前收集到的 CSV 文件。</p><form id="form"><div class="row"><input type="password" id="token" placeholder="管理口令" autocomplete="current-password" required><button>下载 CSV</button></div></form><div class="msg" id="msg" role="status"></div><p class="small">请妥善保管管理口令。导出文件包含所有答卷，请按研究用途妥善保存。</p></main><script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const token=document.querySelector('#token').value;const msg=document.querySelector('#msg');msg.textContent='';try{const r=await fetch('/api/export',{method:'POST',headers:{'Authorization':'Bearer '+token}});if(!r.ok){const j=await r.json();throw Error(j.error||'导出失败')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bedtime_survey_responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg.style.color='#246b4c';msg.textContent='下载已开始。'}catch(err){msg.style.color='#a53e28';msg.textContent=err.message}});</script></body></html>
