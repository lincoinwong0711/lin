services:
  - type: web
    name: student-bedtime-survey
    runtime: node
    plan: starter
    buildCommand: echo "No build step required"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SURVEY_ADMIN_TOKEN
        generateValue: true
    disk:
      name: survey-responses
      mountPath: /var/data
      sizeGB: 1

